<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finalizar Pedido - Cafeteria</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Finalizar Compra</h1>
    <a href="cart.html" class="nav-link">← Voltar para o Carrinho</a>
  </header>
  <main class="checkout-container">
    <div id="resumo-pedido" class="resumo-box"></div>
        <form id="checkout-form" class="checkout-form" novalidate>
      <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" />
        <span class="erro" id="erro-nome"></span>
      </div>

      <div class="form-group">
        <label for="tipo-pedido">Como você quer receber?</label>
        <select id="tipo-pedido">
          <option value="entrega">Entrega</option>
          <option value="mesa">Mesa</option>
        </select>
      </div>

            <div id="campo-endereco">
        <div class="form-group">
          <label for="rua">Rua:</label>
          <input type="text" id="rua" placeholder="Ex.: Rua das Flores" />
          <span class="erro" id="erro-rua"></span>
        </div>

        <div class="form-group">
          <label for="numero">Número da casa:</label>
          <input type="text" id="numero" placeholder="Ex.: 120, 45B ou s/n" />
          <span class="erro" id="erro-numero"></span>
        </div>

        <div class="form-group">
          <label for="complemento">Complemento (opcional):</label>
          <input type="text" id="complemento" placeholder="Apto, bloco, ponto de referência" />
        </div>

        <div class="form-group">
          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" />
          <span class="erro" id="erro-bairro"></span>
        </div>
      </div>

      <div class="form-group" id="campo-mesa">
        <label for="mesa">Número da Mesa:</label>
        <input type="number" id="mesa" min="1" placeholder="Ex.: 5" />
        <span class="erro" id="erro-mesa"></span>
      </div>

      <div class="form-group">
        <label for="pagamento">Forma de Pagamento:</label>
        <select id="pagamento">
          <option value="">Selecione...</option>
          <option value="Pix">Pix</option>
          <option value="Cartao">Cartão de Crédito/Débito</option>
          <option value="Dinheiro">Dinheiro</option>
        </select>
        <span class="erro" id="erro-pagamento"></span>
      </div>

      <button type="submit" class="btn-finalizar">Confirmar e Finalizar</button>
    </form>
  </main>
  <script src="cart.js"></script>
  <script src="buy.js"></script>
</body>
</html>
